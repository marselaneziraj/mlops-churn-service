name: Scheduled drift check

# In production this job reads the previous day's scored traffic from the
# warehouse. Here it regenerates a window from the reference set so the workflow
# is runnable in a fork. A significant PSI fails the job, which is what pages
# whoever owns the model.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: Drift scenario to simulate
        type: choice
        default: covariate
        options: [none, covariate, price, concept]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[monitoring]"
      - name: Prepare a model and reference window
        run: |
          python - <<'PY'
          import pathlib, yaml
          p = pathlib.Path("configs/config.yaml")
          cfg = yaml.safe_load(p.read_text())
          cfg["data"]["source"] = "synthetic"
          cfg["tracking"]["enabled"] = False
          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY
          python -m churn.data.make_dataset --config configs/config.yaml
          python -m churn.models.train --config configs/config.yaml
      - name: Simulate the window
        run: >
          python -m churn.monitoring.simulate_traffic --config configs/config.yaml
          --scenario ${{ inputs.scenario || 'covariate' }} --n 2000
      - name: PSI + Evidently report
        id: drift
        run: python -m churn.monitoring.drift_report --config configs/config.yaml
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            reports/psi.json
            reports/drift_report.html
            docs/figures/drift_psi.png
