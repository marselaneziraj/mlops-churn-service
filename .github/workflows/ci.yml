name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy
        run: mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: Offline pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with tracking + monitoring extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tracking,monitoring]"
      - name: Ingest (synthetic - no network dependency in CI)
        run: |
          python - <<'PY'
          import pathlib, yaml
          p = pathlib.Path("configs/config.yaml")
          cfg = yaml.safe_load(p.read_text())
          cfg["data"]["source"] = "synthetic"
          cfg["data"]["synthetic_rows"] = 3000
          cfg["tracking"]["enabled"] = False
          cfg["model"]["params"]["n_estimators"] = 120
          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY
          python -m churn.data.make_dataset --config configs/config.yaml
      - name: Leakage audit (gates the build)
        run: python -m churn.data.leakage_audit --config configs/config.yaml
      - name: EDA figures
        run: python -m churn.data.eda --config configs/config.yaml
      - name: Train
        run: python -m churn.models.train --config configs/config.yaml
      - name: Drift simulation + PSI (no-drift window must NOT alert)
        run: |
          python -m churn.monitoring.simulate_traffic --config configs/config.yaml --scenario none --n 1500
          python -m churn.monitoring.drift_report --config configs/config.yaml
      - name: Drift simulation + PSI (drifted window MUST alert)
        run: |
          python -m churn.monitoring.simulate_traffic --config configs/config.yaml --scenario covariate --n 1500
          if python -m churn.monitoring.drift_report --config configs/config.yaml; then
            echo "::error::injected covariate drift did not trigger an alert"; exit 1
          else
            echo "drift correctly detected"
          fi
      - name: Upload pipeline artefacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            reports/
            docs/figures/
            models/champion.joblib
          retention-days: 7

  container:
    name: Build image + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Train a model to bake into the image
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python - <<'PY'
          import pathlib, yaml
          p = pathlib.Path("configs/config.yaml")
          cfg = yaml.safe_load(p.read_text())
          cfg["data"]["source"] = "synthetic"
          cfg["data"]["synthetic_rows"] = 3000
          cfg["tracking"]["enabled"] = False
          cfg["model"]["params"]["n_estimators"] = 120
          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY
          python -m churn.data.make_dataset --config configs/config.yaml
          python -m churn.models.train --config configs/config.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: churn-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name churn-smoke -p 8080:8080 churn-api:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python -c "import json,sys; d=json.load(open('/tmp/health.json')); sys.exit(0 if d['status']=='ok' and d['model_loaded'] else 1)"

          curl -fsS -X POST http://localhost:8080/predict \
            -H 'Content-Type: application/json' \
            -H 'X-Request-ID: ci-smoke-1' \
            -d @tests/fixtures/sample_request.json -D /tmp/headers.txt -o /tmp/pred.json
          cat /tmp/headers.txt /tmp/pred.json
          grep -i '^x-model-version:' /tmp/headers.txt
          grep -i '^x-request-id: ci-smoke-1' /tmp/headers.txt
          python -c "import json,sys; d=json.load(open('/tmp/pred.json'))['prediction']; p=d['churn_probability']; sys.exit(0 if 0.0<=p<=1.0 else 1)"

          curl -fsS http://localhost:8080/metrics | grep churn_predictions_total

          # Non-root is a security requirement, not a preference.
          test "$(docker exec churn-smoke id -u)" != "0"
        env:
          DOCKER_BUILDKIT: 1

      - name: Container logs on failure
        if: failure()
        run: docker logs churn-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f churn-smoke || true

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
