[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-churn-service"
version = "0.1.0"
description = "End-to-end MLOps reference project: churn model, FastAPI service, MLflow registry, drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marsela Neziraj" }]

dependencies = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14", "shap>=0.45", "psycopg2-binary>=2.9"]
monitoring = ["evidently>=0.4.25", "requests>=2.32"]
loadtest = ["locust>=2.29"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "types-requests",
  "pre-commit>=3.7",
  "dvc>=3.51",
]

[project.scripts]
churn-train = "churn.models.train:main"
churn-data = "churn.data.make_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests that exercise the API through the ASGI transport",
  "slow: tests that train a model",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["churn"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/churn"]
branch = true
